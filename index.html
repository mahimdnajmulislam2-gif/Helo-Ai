<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello AI - Nazmul</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b1020;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#172b55;
 padding:17px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.logo{font-size:25px;font-weight:bold;color:#55aaff}
header small{color:#cbd5e1}
#chat{
 height:calc(100vh - 155px);
 overflow-y:auto;
 padding:16px;
}
.welcome{
 text-align:center;
 margin:55px 10px 30px;
}
.robot{font-size:65px}
.welcome h2{color:#55aaff}
.msg{
 padding:13px;
 margin:12px 0;
 border-radius:15px;
 max-width:85%;
 line-height:1.6;
 white-space:pre-wrap;
}
.user{
 background:#1769e0;
 margin-left:auto;
}
.ai{
 background:#202c46;
 margin-right:auto;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 padding:12px;
 background:#111a30;
 display:flex;
 gap:8px;
}
input{
 flex:1;
 min-width:0;
 padding:14px;
 border:1px solid #52627e;
 border-radius:25px;
 background:#202c46;
 color:white;
 outline:none;
 font-size:15px;
}
button{
 border:0;
 background:#1684ff;
 color:white;
 border-radius:25px;
 padding:12px 17px;
 font-size:16px;
}
</style>
</head>
<body>

<header>
 <div>
  <div class="logo">🤖 Hello AI</div>
  <small>Created by Nazmul Islam Mahi</small>
 </div>
 <button onclick="clearChat()">New</button>
</header>

<div id="chat">
 <div class="welcome" id="welcome">
  <div class="robot">🤖</div>
  <h2>Welcome to Hello AI!</h2>
  <p>আসসালামু আলাইকুম! সবাইকে Hello AI-তে স্বাগতম।</p>
  <p>আমি Hello AI। তোমাকে কীভাবে সাহায্য করতে পারি?</p>
  <p>নির্মাতা: নাজমুল ইসলাম মাহি</p>
 </div>
</div>

<div class="bottom">
 <input id="message" placeholder="এখানে প্রশ্ন লিখুন..."
 onkeydown="if(event.key==='Enter')send()">
 <button onclick="send()">Send</button>
</div>

<script>
const API_URL = "YOUR_WORKER_URL";

function addMessage(text,type){
 const chat=document.getElementById("chat");
 document.getElementById("welcome")?.remove();

 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

async function send(){
 const input=document.getElementById("message");
 const question=input.value.trim();
 if(!question)return;

 input.value="";
 addMessage(question,"user");

 if(question.toLowerCase().includes("তোমাকে কে তৈরি করেছে") ||
 question.toLowerCase().includes("তোমার নির্মাতা")){
  addMessage("আমাকে তৈরি করেছেন নাজমুল ইসলাম মাহি। ❤️","ai");
  return;
 }

 const loading=addMessage("উত্তর তৈরি হচ্ছে...","ai");

 if(API_URL==="YOUR_WORKER_URL"){
  loading.textContent="AI চালু করতে Cloudflare Worker API যুক্ত করতে হবে।";
  return;
 }

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:question})
  });

  const data=await response.json();

  if(!response.ok)throw new Error("API Error");

  loading.textContent=data.reply || "কোনো উত্তর পাওয়া যায়নি।";
 }catch(error){
  loading.textContent="দুঃখিত! সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করো।";
 }
}

function clearChat(){
 document.getElementById("chat").innerHTML=`
 <div class="welcome" id="welcome">
 <div class="robot">🤖</div>
 <h2>Welcome to Hello AI!</h2>
 <p>আসসালামু আলাইকুম! সবাইকে স্বাগতম।</p>
 <p>নির্মাতা: নাজমুল ইসলাম মাহি</p>
 </div>`;
}
</script>
</body>
 </html>
