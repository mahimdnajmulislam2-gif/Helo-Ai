<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Ai - মোহা: নাজমুল ইসলাম মাহী</title>
  <style>
    :root {
      --bg-color: #212121;
      --chat-bg: #2f2f2f;
      --header-bg: #171717;
      --text-color: #ececec;
      --sub-text: #a0a0a0;
      --accent: #10a37f;
      --border: #3e3e3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* হেডার ডিজাইন */
    header {
      background-color: var(--header-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 { font-size: 18px; color: #fff; font-weight: 600; }
    .brand p { font-size: 11px; color: var(--accent); margin-top: 2px; }

    .new-chat-btn {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .new-chat-btn:hover { background: var(--chat-bg); }

    /* চ্যাট বক্স */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      gap: 12px;
      line-height: 1.6;
      font-size: 15px;
      animation: fadeIn 0.3s ease;
    }

    .user-row { justify-content: flex-end; }
    
    .user-bubble {
      background-color: var(--chat-bg);
      color: #fff;
      padding: 10px 16px;
      border-radius: 18px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .ai-row { justify-content: flex-start; align-items: flex-start; }

    .ai-avatar {
      width: 32px;
      height: 32px;
      background-color: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      flex-shrink: 0;
    }

    .ai-bubble {
      color: var(--text-color);
      max-width: 88%;
      word-wrap: break-word;
      padding-top: 3px;
    }

    .ai-bubble pre {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: monospace;
      font-size: 13px;
    }

    /* ইনপুট এরিয়া */
    .input-wrapper {
      background-color: var(--bg-color);
      padding: 10px 15px 15px;
      border-top: 1px solid var(--border);
    }

    .input-box {
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--chat-bg);
      border-radius: 24px;
      padding: 6px 10px 6px 18px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      resize: none;
      max-height: 100px;
      outline: none;
      padding: 8px 0;
    }

    #send-btn {
      background-color: #fff;
      color: #000;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
    }
    #send-btn:disabled { background-color: #555; cursor: not-allowed; }

    .footer-credit {
      text-align: center;
      font-size: 11px;
      color: var(--sub-text);
      margin-top: 8px;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Hello Ai</h1>
      <p>তৈরি করেছেন: মোহা: নাজমুল ইসলাম মাহী</p>
    </div>
    <button class="new-chat-btn" onclick="resetChat()">+ নতুন চ্যাট</button>
  </header>

  <div id="chat-container"></div>

  <div class="input-wrapper">
    <div class="input-box">
      <textarea id="user-input" rows="1" placeholder="Hello Ai-কে কিছু জিজ্ঞেস করুন..."></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <div class="footer-credit">Hello Ai • ডেভেলপার: মোহা: নাজমুল ইসলাম মাহী</div>
  </div>

  <script>
    // এখানে আপনার Cloudflare Worker-এর লিংক বসান
    const WORKER_URL = "https://workers.dev";

    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    // চ্যাট হিস্ট্রি মনে রাখার অ্যারে
    let chatHistory = [
      {
        role: "user",
        parts: [{ text: "তোমার নাম Hello Ai এবং তোমাকে তৈরি করেছেন মোহা: নাজমুল ইসলাম মাহী। কেউ পরিচয় জানতে চাইলে এটি বলবে এবং সবসময় বিনয়ী ও ইসলামিক আদব বজায় রেখে উত্তর দেবে।" }]
      },
      {
        role: "model",
        parts: [{ text: "জি, অবশ্যই! আসসালামু আলাইকুম। আমি Hello Ai, আমাকে তৈরি করেছেন মোহা: নাজমুল ইসলাম মাহী। আমি আপনাকে কীভাবে সাহায্য করতে পারি?" }]
      }
    ];

    // শুরুতেই সালাম প্রদর্শন
    window.onload = () => {
      showWelcomeMessage();
    };

    function showWelcomeMessage() {
      chatContainer.innerHTML = `
        <div class="message-row ai-row">
          <div class="ai-avatar">AI</div>
          <div class="ai-bubble">
            <strong>আসসালামু আলাইকুম ওয়া রহমাতুল্লাহ!</strong> 🌙<br><br>
            আমি <strong>Hello Ai</strong>। আমাকে তৈরি করেছেন <strong>মোহা: নাজমুল ইসলাম মাহী</strong>।<br>
            আজ আপনাকে কীভাবে সাহায্য করতে পারি?
          </div>
        </div>
      `;
    }

    function resetChat() {
      chatHistory = chatHistory.slice(0, 2);
      showWelcomeMessage();
    }

    // Enter চাপলে মেসেজ পাঠানো
    userInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function formatText(text) {
      return text
        .replace(/```([\s\(\S\)]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // ইউজারের মেসেজ যোগ করা
      chatContainer.innerHTML += `
        <div class="message-row user-row">
          <div class="user-bubble">${text.replace(/\n/g, '<br>')}</div>
        </div>
      `;
      userInput.value = "";
      sendBtn.disabled = true;

      // হিস্ট্রিতে ইউজারের কথা সেভ করা
      chatHistory.push({ role: "user", parts: [{ text: text }] });

      const loadingId = "load-" + Date.now();
      chatContainer.innerHTML += `
        <div class="message-row ai-row" id="${loadingId}">
          <div class="ai-avatar">AI</div>
          <div class="ai-bubble">Hello Ai লিখছে...</div>
        </div>
      `;
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: chatHistory })
        });

        const data = await response.json();
        const aiReply = data.candidates?.?.content?.parts?.?.text || "দুঃখিত, এই মুহূর্তে উত্তর দিতে পারছি না।";

        // হিস্ট্রিতে AI-এর উত্তর সেভ করা
        chatHistory.push({ role: "model", parts: [{ text: aiReply }] });

        document.getElementById(loadingId).querySelector(".ai-bubble").innerHTML = formatText(aiReply);
      } catch (err) {
        document.getElementById(loadingId).querySelector(".ai-bubble").innerHTML = "⚠️ সংযোগ সমস্যা! Cloudflare Worker লিংক বা ইন্টারনেট চেক করুন।";
      }

      sendBtn.disabled = false;
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
