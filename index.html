<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello AI - Nazmul</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#091225;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#172d58;
 padding:15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.brand{
 display:flex;
 align-items:center;
 gap:10px;
}
.logo{
 width:58px;
 height:58px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #50a8ff;
}
h1{
 color:#55aaff;
 font-size:24px;
 margin:0;
}
small{color:#d4e2fa}
button{
 border:0;
 background:#1685ff;
 color:white;
 padding:13px 19px;
 border-radius:25px;
 font-size:16px;
}
#chat{
 height:calc(100dvh - 165px);
 overflow-y:auto;
 padding:15px;
}
.welcome{
 text-align:center;
 padding:65px 8px;
}
.welcome img{
 width:115px;
 height:115px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid #55aaff;
}
.welcome h2{
 color:#55aaff;
 font-size:27px;
}
.welcome p{
 font-size:20px;
 line-height:1.7;
}
.msg{
 padding:13px;
 margin:12px 0;
 border-radius:16px;
 max-width:88%;
 line-height:1.7;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#1769e0;
 margin-left:auto;
}
.ai{
 background:#202f4c;
 margin-right:auto;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#121d35;
 padding:12px;
 display:flex;
 gap:8px;
}
input{
 flex:1;
 min-width:0;
 padding:15px;
 border-radius:30px;
 border:2px solid #526786;
 background:#202e49;
 color:white;
 font-size:16px;
 outline:none;
}
</style>
</head>

<body>

<header>
 <div class="brand">
<img class="logo" src="file_0000000006308211824cebc03e2b4c3c.png" alt="Hello AI Logo"> <div>
   <h1>Hello AI</h1>
   <small>Created by Nazmul</small>
  </div>
 </div>
 <button onclick="clearChat()">New</button>
</header> <img src="file_0000000006308211824cebc03e2b4c3c.png" alt="Hello AI">

<div id="chat">
 <div class="welcome" id="welcome">
  <img src="file_0000000006308211824cebc03e2b4c3c.png" alt="Hello AI"> alt="Hello AI">
  <h2>Welcome to Hello AI!</h2>
  <p>আসসালামু আলাইকুম! আপনাকে স্বাগতম। ❤️</p>
  <p>আমি Hello AI। আপনাকে কীভাবে সাহায্য করতে পারি?</p>
  <p>নির্মাতা: মোহা: নাজমুল ইসলাম মাহী</p>
 </div>
</div>

<div class="bottom">
 <input id="message"
 placeholder="এখানে প্রশ্ন লিখুন..."
 onkeydown="if(event.key==='Enter')send()">
 <button onclick="send()">Send</button>
</div>

<script>

// Cloudflare Worker URL এখানে বসাবে
const API_URL = "YOUR_WORKER_URL";

function addMessage(text,type){
 const chat=document.getElementById("chat");
 document.getElementById("welcome")?.remove();

 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

async function send(){
 const input=document.getElementById("message");
 const question=input.value.trim();

 if(!question)return;

 input.value="";
 addMessage(question,"user");

 const q=question.toLowerCase();

 if(
 q.includes("তোমাকে কে তৈরি করেছে") ||
 q.includes("তোমার নির্মাতা") ||
 q.includes("কে বানিয়েছে") ||
 q.includes("কে বানিয়েছে") ||
 q.includes("who created you") ||
 q.includes("who made you")
 ){
  addMessage(
   "আমাকে তৈরি করেছেন মোহা: নাজমুল ইসলাম মাহী। ❤️",
   "ai"
  );
  return;
 }

 if(q.includes("সালাম") || q.includes("আসসালামু")){
  addMessage(
   "ওয়ালাইকুম আসসালাম! Hello AI-তে আপনাকে স্বাগতম। ❤️",
   "ai"
  );
  return;
 }

 const loading=addMessage("উত্তর তৈরি হচ্ছে...","ai");

 if(API_URL==="YOUR_WORKER_URL"){
  loading.textContent=
  "Hello AI চালু আছে। AI উত্তর পেতে API সংযুক্ত করতে হবে।";
  return;
 }

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:question})
  });

  const data=await response.json();

  if(!response.ok)throw new Error("API Error");

  loading.textContent=data.reply ||
  "দুঃখিত, উত্তর পাওয়া যায়নি।";

 }catch(error){
  loading.textContent=
  "দুঃখিত! সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
 }
}

function clearChat(){
 document.getElementById("chat").innerHTML=`
 <div class="welcome" id="welcome">
 <img src="logo.png" alt="Hello AI">
 <h2>Welcome to Hello AI!</h2>
 <p>আসসালামু আলাইকুম! আপনাকে স্বাগতম। ❤️</p>
 <p>আামাকে তৈরি করেছেন মোহা: নাজমুল ইসলাম মাহী</p>
 </div>`;
}

</script>
</body>
  </html>
