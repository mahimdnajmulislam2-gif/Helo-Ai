<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello AI - Nazmul</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1020;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 height:75px;
 background:#111a30;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
 border-bottom:1px solid #263653;
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
}

.logo{
 width:45px;
 height:45px;
 border-radius:15px;
 background:linear-gradient(135deg,#1685ff,#743cff);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:27px;
 font-weight:bold;
}

.brand h2{
 margin:0;
 color:#60a5ff;
}

.brand small{
 color:#aab9d1;
}

button{
 border:0;
 border-radius:25px;
 background:#1685ff;
 color:white;
 padding:12px 20px;
 font-size:16px;
 cursor:pointer;
}

#chat{
 height:calc(100dvh - 150px);
 overflow-y:auto;
 padding:18px;
 padding-bottom:25px;
}

.welcome{
 text-align:center;
 padding:70px 10px;
}

.welcome .biglogo{
 width:85px;
 height:85px;
 margin:auto;
 border-radius:27px;
 background:linear-gradient(135deg,#1685ff,#743cff);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:45px;
}

.welcome h1{
 color:#60a5ff;
 font-size:29px;
}

.welcome p{
 color:#d3dced;
 font-size:19px;
 line-height:1.8;
}

.creator{
 color:#60a5ff!important;
 font-size:16px!important;
}

.msg{
 max-width:85%;
 padding:14px;
 margin:15px 0;
 border-radius:17px;
 line-height:1.7;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.user{
 background:#1769e0;
 margin-left:auto;
}

.ai{
 background:#1b2942;
 margin-right:auto;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#111a30;
 padding:12px;
 display:flex;
 gap:10px;
 border-top:1px solid #263653;
}

input{
 flex:1;
 min-width:0;
 padding:15px;
 border-radius:30px;
 border:2px solid #405577;
 background:#1b2942;
 color:white;
 font-size:16px;
 outline:none;
}

input::placeholder{
 color:#9aa9c0;
}

#send{
 min-width:80px;
}

</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">H</div>
  <div>
   <h2>Hello AI</h2>
   <small>Created by Nazmul</small>
  </div>
 </div>
 <button onclick="clearChat()">New</button>
</header>

<div id="chat">

 <div class="welcome" id="welcome">
  <div class="biglogo">H</div>

  <h1>Hello AI</h1>

  <p>
   আসসালামু আলাইকুম! ❤️<br>
   Hello AI-তে আপনাকে স্বাগতম।
  </p>

  <p>
   আমি আপনার AI সহকারী।<br>
   আমাকে যেকোনো প্রশ্ন করতে পারেন।
  </p>

  <p class="creator">
   তৈরি করেছেন:<br>
   মোঃ নাজমুল ইসলাম মাহী
  </p>
 </div>

</div>

<div class="bottom">
 <input
  id="message"
  type="text"
  placeholder="এখানে প্রশ্ন লিখুন..."
  onkeydown="if(event.key==='Enter')send()"
 >
 <button id="send" onclick="send()">Send</button>
</div>

<script>

// Cloudflare Worker URL এখানে বসাবে
const API_URL = "YOUR_WORKER_URL";

function addMessage(text,type){
 const chat=document.getElementById("chat");
 document.getElementById("welcome")?.remove();

 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

async function send(){

 const input=document.getElementById("message");
 const question=input.value.trim();

 if(!question)return;

 input.value="";
 addMessage(question,"user");

 const loading=addMessage("উত্তর তৈরি হচ্ছে...","ai");

 if(API_URL==="YOUR_WORKER_URL"){
  loading.textContent="Cloudflare Worker URL বসাতে হবে।";
  return;
 }

 try{

  const response=await fetch(API_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:question
   })
  });

  const data=await response.json();

  if(!response.ok)throw new Error("API Error");

  loading.textContent=data.reply ||
   "দুঃখিত, উত্তর পাওয়া যায়নি।";

 }catch(error){

  loading.textContent=
   "দুঃখিত! সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।";

 }
}

function clearChat(){

 document.getElementById("chat").innerHTML=`
 <div class="welcome" id="welcome">
  <div class="biglogo">H</div>
  <h1>Hello AI</h1>
  <p>আসসালামু আলাইকুম! ❤️<br>
  Hello AI-তে আপনাকে স্বাগতম।</p>
  <p>তৈরি করেছেন:<br>
  মোঃ নাজমুল ইসলাম মাহী</p>
 </div>
 `;

}

</script>

</body>
</html>
